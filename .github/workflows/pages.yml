name: Deploy Pages
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: Pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun tools/emit-progress.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/progress
      - id: deployment
        uses: actions/deploy-pages@v4
